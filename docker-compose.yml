services:
  influxdb:
    image: influxdb:2.7
    container_name: iot-influxdb
    ports: ["8086:8086"]
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: admin12345
      DOCKER_INFLUXDB_INIT_ORG: iot
      DOCKER_INFLUXDB_INIT_BUCKET: iot_raw
      DOCKER_INFLUXDB_INIT_RETENTION: 7d        # retention du lieu tho
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-my-super-token}
    volumes:
      - influx-data:/var/lib/influxdb2
      - ./influx-init:/docker-entrypoint-initdb.d:ro   # tu dong tao bucket iot_clean

  grafana:
    image: grafana/grafana:latest
    container_name: iot-grafana
    ports: ["3000:3000"]
    depends_on: [influxdb]
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN:-my-super-token}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  influx-data:
  grafana-data:
